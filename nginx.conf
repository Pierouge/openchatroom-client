events { }
http {
   include mime.types;

   # HTTP
   server {
      listen 80;
      index index.html;

      # Tell Nginx the real port the client is connecting to
      port_in_redirect off;
      absolute_redirect off;

      add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src * data:;
        connect-src *;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
        form-action 'self';
      " always;

      location / {
         root /var/www/web;
         try_files $uri $uri/ /index.html =404;
      }
   }

   # HTTPS
   server {
      listen 443 ssl;
      server_name localhost;

      # Tell Nginx not to redirect to standard ports
      port_in_redirect off;
      absolute_redirect off;

      ssl_certificate     /etc/nginx/certs/localhost.crt;
      ssl_certificate_key /etc/nginx/certs/localhost.key;

      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;

      index index.html;

      add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src * data:;
        connect-src *;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
        form-action 'self';
      " always;

      location / {
          root /var/www/web;
          try_files $uri $uri/ /index.html =404;
      }
   }
}

